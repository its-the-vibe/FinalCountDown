services:
  app:
    build: .
    image: ghcr.io/its-the-vibe/finalcountdown:latest
    pull_policy: always
    ports:
      - "${PORT:-8080}:8080"
    user: "${UID:-65532}:${GID:-65532}"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./static:/static:ro
    environment:
      - CONFIG_PATH=/config.yaml
      - LISTEN_ADDR=:8080
    read_only: true
    restart: on-failure:10
